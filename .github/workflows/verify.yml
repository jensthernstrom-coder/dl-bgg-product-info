name: Verify theme app extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify RPG terminology and language handling
        run: node --test tests/rpg-display.test.mjs
      - name: Build Shopify theme app extension
        run: npx shopify app build
